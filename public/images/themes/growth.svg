<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="growthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b38"/>
      <stop offset="50%" stop-color="#0f4559"/>
      <stop offset="100%" stop-color="#061d26"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe6b8"/>
      <stop offset="100%" stop-color="#0fb38b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34f0c2"/>
      <stop offset="100%" stop-color="#116b5a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144b60"/>
      <stop offset="100%" stop-color="#082b39"/>
    </linearGradient>
    <filter id="growthShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#growthBg)"/>

  <!-- Subtle Radial/Hex Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
  </g>

  <!-- Central Circular Graphic -->
  <g filter="url(#growthShadow)">
    <circle cx="300" cy="210" r="130" fill="url(#cardGrad)" stroke="url(#tealGlow)" stroke-width="4"/>
    <circle cx="300" cy="210" r="116" fill="none" stroke="#22708b" stroke-width="1.5" opacity="0.7"/>

    <!-- Rising Chart Bars -->
    <rect x="220" y="240" width="28" height="50" rx="4" fill="url(#barGrad)" opacity="0.6"/>
    <rect x="260" y="205" width="28" height="85" rx="4" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="300" y="170" width="28" height="120" rx="4" fill="url(#barGrad)"/>
    <rect x="340" y="130" width="28" height="160" rx="4" fill="#58ffce"/>

    <!-- Rising Trend Arrow Path -->
    <path d="M220 230 Q 280 180, 360 115" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <polygon points="360,105 375,125 350,128" fill="#ffffff"/>

    <!-- Sparkle / Star at peak -->
    <circle cx="365" cy="115" r="4" fill="#ffffff"/>
  </g>

  <!-- Subtitle Tag -->
  <text x="300" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#7bedce" text-anchor="middle" letter-spacing="3">CAREER PROGRESSION</text>

  <!-- Bottom Banner Pill -->
  <g filter="url(#growthShadow)">
    <rect x="130" y="390" width="340" height="52" rx="26" fill="#07222c" stroke="url(#tealGlow)" stroke-width="2"/>
    <text x="300" y="423" font-family="'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="20" fill="#ffffff" text-anchor="middle">DPC / ACP / MACP पदोन्नति</text>
  </g>
</svg>